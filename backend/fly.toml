app = "nexus-backend"
primary_region = "ams"

[build]
  image = "nexus-backend:latest"

[env]
  PORT = "8080"
  AGORA_APP_ID = ""
  AGORA_APP_CERTIFICATE = ""

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
