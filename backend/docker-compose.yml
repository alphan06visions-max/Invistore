version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://nexus:nexus@db:5432/nexus?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: nexus-local-dev-secret
    depends_on: [db, redis]
volumes: {pgdata:}
