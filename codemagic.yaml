workflows:
  fridr-android:
    name: Friðr Android APK
    max_build_duration: 60
    environment:
      node: 20.11.0
    scripts:
      - name: Install deps
        script: cd mobile && npm install
      - name: Prebuild Android (auto-signing via plugin)
        script: cd mobile && npx expo prebuild --platform android --clean
      - name: Copy keystore to android/app
        script: cp mobile/android-signing/fridr.keystore mobile/android/app/fridr.keystore
      - name: Build APK
        script: cd mobile/android && ./gradlew assembleRelease
    artifacts:
      - mobile/android/app/build/outputs/apk/release/app-release.apk