# Codemagic YAML — Build APK for NEXUS React Native (Expo) app
# Build natif Android direct — pas besoin de projet Expo/EAS
workflows:
  nexus-android-apk:
    name: NEXUS Android APK
    max_build_duration: 60
    environment:
      node: 20.11.0
      android_signing: []
    scripts:
      - name: Install dependencies
        script: |
          cd mobile
          npm install
      - name: Prebuild Android project
        script: |
          cd mobile
          npx expo prebuild --platform android --clean
      - name: Build APK with Gradle
        script: |
          cd mobile/android
          ./gradlew assembleRelease
    artifacts:
      - mobile/android/app/build/outputs/apk/release/app-release.apk
