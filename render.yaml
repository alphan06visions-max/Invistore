services:
  - type: web
    name: nexus-backend
    runtime: docker
    repo: https://github.com/alphan06visions-max/Invistore
    branch: main
    rootDir: backend
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nexus-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_URL
        sync: false
      - key: STREAM_API_KEY
        value: tdkqnce9zrxw
      - key: STREAM_API_SECRET
        value: gjgexvaptnrhsfwy28zcusqrvdddztetbhcnjx7kjakcbtyjch4gyjp2xqhs76yv

databases:
  - name: nexus-db
    plan: free

  - name: nexus-redis
    plan: free
