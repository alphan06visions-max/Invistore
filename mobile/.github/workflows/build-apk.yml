name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm ci || npm install

      - name: Set backend URLs
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ secrets.API_URL || 'https://nexus-backend.fly.dev' }}" > .env
          echo "EXPO_PUBLIC_WS_URL=${{ secrets.WS_URL || 'wss://nexus-backend.fly.dev/ws' }}" >> .env

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install --clean

      - name: Gradle assembleRelease
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
